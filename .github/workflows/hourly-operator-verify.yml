name: Hourly operator verify

on:
  push:
    branches:
      - automation/hourly-operator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify production dependency integrity
        run: node scripts/check-production-dependencies.mjs
      - name: Verify canonical methodology locale model
        run: |
          rm -rf .tmp/methodology-test
          npx tsc --module commonjs --target ES2020 --lib ES2020,DOM --moduleResolution node --esModuleInterop --skipLibCheck --noEmit false --outDir .tmp/methodology-test lib/i18n/locales.ts lib/i18n/methodology-content.ts test/methodology-content.test.ts
          node --test .tmp/methodology-test/test/methodology-content.test.js
      - name: Verify reviewed translation provenance intake, lookup and evidence projection
        run: |
          rm -rf .tmp/reviewed-translation-test
          npx tsc --module commonjs --target ES2020 --lib ES2020,DOM --moduleResolution node --esModuleInterop --skipLibCheck --noEmit false --outDir .tmp/reviewed-translation-test lib/i18n/locales.ts lib/i18n/translation-provenance.ts lib/i18n/reviewed-translation-record.ts lib/i18n/reviewed-translation-index.ts lib/i18n/structured-evidence-projection.ts test/reviewed-translation-record.test.ts test/reviewed-translation-index.test.ts test/structured-evidence-projection.test.ts
          node --test .tmp/reviewed-translation-test/test/reviewed-translation-record.test.js .tmp/reviewed-translation-test/test/reviewed-translation-index.test.js .tmp/reviewed-translation-test/test/structured-evidence-projection.test.js
      - run: npm run lint
      - run: npm run build
      - name: Start exact branch build
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/for-ai-next.log 2>&1 &
          echo $! > /tmp/for-ai-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/for-ai-next.log
          exit 1
      - name: Assert verification methodology locale routes
        run: |
          curl --fail --silent --show-error --location --output /tmp/methodology-default.html http://127.0.0.1:3000/methodology
          curl --fail --silent --show-error --location --output /tmp/methodology-ko.html 'http://127.0.0.1:3000/methodology?lang=ko'
          curl --fail --silent --show-error --location --output /tmp/methodology-en.html 'http://127.0.0.1:3000/methodology?lang=en'
          curl --fail --silent --show-error --location --output /tmp/methodology-hi.html 'http://127.0.0.1:3000/methodology?lang=hi'
          test -s /tmp/methodology-default.html
          grep -q 'For-Ai 검증 방법' /tmp/methodology-ko.html
          grep -q 'For-Ai verification method' /tmp/methodology-en.html
          grep -q 'canonical English version is shown' /tmp/methodology-hi.html
          grep -q 'हिन्दी' /tmp/methodology-hi.html
      - name: Capture real home and methodology screens with installed Chromium
        run: |
          mkdir -p artifacts
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-family browser found on runner"
            exit 1
          fi
          "$CHROME_BIN" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=artifacts/home-methodology-nav.png http://127.0.0.1:3000
          "$CHROME_BIN" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=artifacts/methodology-route.png 'http://127.0.0.1:3000/methodology?lang=ko'
          test -s artifacts/home-methodology-nav.png
          test -s artifacts/methodology-route.png
      - uses: actions/upload-artifact@v4
        with:
          name: hourly-operator-screen
          path: |
            artifacts/home-methodology-nav.png
            artifacts/methodology-route.png
