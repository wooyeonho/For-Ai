name: Hourly operator verify

on:
  push:
    branches:
      - automation/hourly-operator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start exact branch build
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/for-ai-next.log 2>&1 &
          echo $! > /tmp/for-ai-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/for-ai-next.log
          exit 1
      - name: Capture real home screen with installed Chromium
        run: |
          mkdir -p artifacts
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chromium-family browser found on runner"
            exit 1
          fi
          "$CHROME_BIN" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=artifacts/home-methodology-nav.png http://127.0.0.1:3000
          test -s artifacts/home-methodology-nav.png
      - uses: actions/upload-artifact@v4
        with:
          name: hourly-operator-screen
          path: artifacts/home-methodology-nav.png
